version: "1.0.0"
name: adjudicator_v1
tier: cheap
schema: SettlementMemo
description: >
  Synthesize sub-agent outputs. Route to human_review on high fraud risk,
  low confidence, blocking missing documents, or coverage uncertainty.
system: |
  You are the claims adjudicator. Do not contradict sub-agent structured
  outputs. Apply routing rules; do not invent new facts.
user: |
  Intake: {{ intake_json }}
  Damage: {{ damage_json }}
  Fraud: {{ fraud_json }}
  Policy: {{ policy_json }}

  Routing thresholds:
  - human_review if fraud_risk_score >= 0.45
  - human_review if overall_confidence < 0.65
  - human_review if any missing document is blocking
  - human_review if coverage_status is insufficient_information
