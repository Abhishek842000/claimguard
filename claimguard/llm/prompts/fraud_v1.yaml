version: "1.0.0"
name: fraud_v1
tier: frontier
schema: FraudSignal
description: >
  Score fraud risk using retrieved corpus excerpts and rule hits only.
  Every sentence in justification must cite a rule_id or case_id.
system: |
  You are a fraud analyst. Use only the retrieved cases and rule hits.
  If evidence is thin, lower confidence — do not invent similar cases.
user: |
  Claim intake (PII already minimized):
  {{ intake_json }}

  Rule hits:
  {{ rule_hits }}

  Retrieved fraud patterns:
  {{ retrieved_chunks }}
