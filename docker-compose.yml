# ClaimGuard local stack.
#
# Application services: postgres (pgvector), redis, migrate, api, worker
# Observability (Langfuse v3/v4 official topology, namespaced to avoid collisions):
#   langfuse-db, clickhouse, minio, langfuse-web, langfuse-worker
# Redis is shared: Langfuse uses the default DB, Celery uses logical DB 1.
#
# Adapted from https://github.com/langfuse/langfuse/blob/main/docker-compose.yml
# Service `postgres` in the upstream file is `langfuse-db` here so ClaimGuard
# can own the pgvector instance.

x-claimguard-env: &claimguard-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql+psycopg://claimguard:claimguard@postgres:5432/claimguard
  REDIS_URL: redis://:${REDIS_AUTH:-claimguard-redis}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_AUTH:-claimguard-redis}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_AUTH:-claimguard-redis}@redis:6379/1
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  LANGFUSE_HOST: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-claimguard-local}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-claimguard-local}

x-claimguard-app: &claimguard-app
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    <<: *claimguard-env
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-langfuse-depends-on: &langfuse-depends-on
  langfuse-db:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
  SALT: ${LANGFUSE_SALT:-claimguard-local-salt}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-a1b2c3d4e5f6789012345678abcdef00a1b2c3d4e5f6789012345678abcdef00}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:-claimguard-redis}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: claimguard
      POSTGRES_DB: claimguard
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - claimguard_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard -d claimguard"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH:-claimguard-redis}
      --maxmemory-policy noeviction
    environment:
      REDIS_AUTH: ${REDIS_AUTH:-claimguard-redis}
    ports:
      - "6379:6379"
    volumes:
      - claimguard_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    <<: *claimguard-app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *claimguard-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    <<: *claimguard-app
    restart: unless-stopped
    environment:
      <<: *claimguard-env
      C_FORCE_ROOT: "true"
    command:
      [
        "celery",
        "-A",
        "apps.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "-Q",
        "claims",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  langfuse-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    # Create the Langfuse bucket as a directory before the server starts
    # (same pattern as the official Langfuse compose file).
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - "9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:3.88.0
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      <<: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:3.88.0
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-claimguard-local-nextauth-secret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: claimguard
      LANGFUSE_INIT_ORG_NAME: ClaimGuard
      LANGFUSE_INIT_PROJECT_ID: claimguard-local
      LANGFUSE_INIT_PROJECT_NAME: ClaimGuard Local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-claimguard-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-claimguard-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-dev@claimguard.local}
      LANGFUSE_INIT_USER_NAME: Local Dev
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-claimguarddev}

volumes:
  claimguard_postgres_data:
  claimguard_redis_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
