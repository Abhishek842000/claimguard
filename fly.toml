# ClaimGuard on Fly.io — one image, two processes (API + Celery worker).
# Exact CLI steps: docs/DEPLOY.md
#
# Tradeoff vs two Fly apps: process groups share the image and secrets, so a
# bad deploy rolls both; two apps would let you scale the worker independently
# at the cost of duplicating secrets. One app is enough for the demo budget.

app = "claimguard"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[processes]
  api = "uvicorn apps.api.main:app --host 0.0.0.0 --port 8080"
  worker = "celery -A apps.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=2 -Q claims"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
  processes = ["worker"]
