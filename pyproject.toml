[project]
name = "claimguard"
version = "0.1.0"
description = "Multi-agent insurance claims triage and fraud detection system."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "ClaimGuard" }]
keywords = ["insurance", "claims", "fraud", "langgraph", "rag", "llmops"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "structlog>=24.4.0",
    "email-validator>=2.2.0",
    "reportlab>=4.2.0",
    "pillow>=11.0.0",
    "piexif>=1.1.3",
    "rank-bm25>=0.2.2",
    "numpy>=2.0.0",
    "fastembed>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
claimguard-eval = "claimguard.eval.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimguard", "apps"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: hits dockerized postgres/redis",
    "eval: evaluation harness tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["claimguard", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["UP", "I"]
"tests/*" = ["RUF001"]
